name: 功能建议 (Feature Request)
description: 提出新功能、算法/控制改进、硬件优化或协作流程建议
title: "[Feat]: "
labels: ["enhancement"]
body:
  - type: dropdown
    id: module
    attributes:
      label: 所属模块
      options:
        - 算法
        - 电力
        - 固件
        - 机械
        - 通信
        - 仓库配置/文档
    validations:
      required: true
  - type: textarea
    id: background
    attributes:
      label: 背景与目标
      description: 说明希望解决什么问题，或希望提升哪项性能/安全/可维护性指标。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 描述拟采取的设计思路、接口变动或参考方案。
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: 约束与影响评估
      description: 请评估是否涉及 AGENTS.md 车端编译语言要求（C/C++/Rust）、模块接口协议、采购 BOM、机械包络或安全保护边界。
