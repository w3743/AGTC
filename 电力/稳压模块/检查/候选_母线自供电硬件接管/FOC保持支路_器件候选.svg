<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="800" viewBox="0 0 1500 800"><rect width="1500" height="800" fill="white"/><style>text{font-family:Microsoft YaHei,sans-serif;font-size:23px;fill:#182b3a}.t{font-size:30px;font-weight:bold}.w{stroke:#173c54;stroke-width:3;fill:none}.n{font-size:20px}</style><text x="35" y="48" class="t">FOC 保持支路器件候选（每车两块，完全相同）</text><text x="35" y="94">FOC 本板 GPIO 候选 ── 4.7kΩ ──┬── ① B  Q_HOLD BC847C</text><path class="w" d="M460 110 V200 H600"/><text x="270" y="170">100kΩ</text><text x="300" y="205">GND_SYS</text><text x="600" y="150">② E ── GND_SYS</text><text x="600" y="195">③ C ── BUCK_CLAMP_BASE</text><text x="35" y="260">Q_HOLD 的 C/E 并联现有 Q_BUCK_RELEASE；不得连接 LPV。</text><text x="35" y="307">GPIO 候选：J_MCU_L.9 / 核心板 P1.9 PC6；快照 ENET 为 NC。</text><text x="35" y="345">PC6 板载 5.1k 与蓝色 LED 支路；核对插接方向、IOC占用与 GPIO 复位态。</text><text x="35" y="398">每板新增：BC847C ×1、4.7kΩ ×1、100kΩ ×1；每车两板各 ×2。</text><text x="35" y="446">LPV 掉电检测及触发逻辑未确定；核算集电极电流、基极驱动、共地与故障状态。</text><text x="35" y="495">比较模型由主任务执行 24 个工况；模型结果不等于硬件验证或制造批准。</text><text x="35" y="545">HOLD：器件、电阻公差与功率、实际接线和制动能力须校核；此图非原生工程。</text></svg>
