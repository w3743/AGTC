<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100"><rect width="100%" height="100%" fill="#fff"/><style>text{font:20px Microsoft YaHei,sans-serif;fill:#123}.s{font-size:17px}.r{fill:#a11;font-weight:bold}.b{fill:#f2f7fa;stroke:#234;stroke-width:2}.w{stroke:#234;stroke-width:3;fill:none}</style><text x="25" y="40" class="r">HOLD：TPS386000 独立域冷启动互锁器件候选 — 尚不可上电</text><text x="25" y="74" class="s">非原生 CAD，未经过 DRC、最坏角或实测；独立供电与BMS预充接口待定</text><rect class="b" x="30" y="115" width="390" height="170"/><text x="50" y="150">TLV76033DBZR</text><text x="50" y="185">2 IN ← 12V_HW（独立域）</text><text x="50" y="215">1 OUT → 3V3_MON</text><text x="50" y="245">3 GND → GND_SYS</text><text x="50" y="270" class="s">输出经100Ω至3V3_F；2.2µF至地</text><rect class="b" x="510" y="115" width="560" height="660"/><text x="530" y="150">TPS386000RGPR · VQFN20</text><text x="530" y="188">14 VDD ← 3V3_F（滤波后）</text><text x="530" y="220">12 GND、11 NC、PAD → GND_SYS</text><text x="530" y="252">1 MR ← 3V3_F 经 100k</text><text x="530" y="284">2 CT4、3 CT3、4 CT2、5 CT1：悬空</text><text x="530" y="316">10 SENSE1 ← 3V3_DIV</text><text x="530" y="348">9 SENSE2 ← 12V_DIV</text><text x="530" y="380">7 SENSE4L ← REF_L_DIV</text><text x="530" y="412">6 SENSE4H ← REF_H_DIV</text><text x="530" y="444">8 SENSE3 ← 3V3_F；17 RESET3：悬空</text><text x="530" y="476">15 RESET1 ┐</text><text x="530" y="508">16 RESET2 ├→ HW_READY</text><text x="530" y="540">18 RESET4 ┘</text><text x="530" y="572">13 VREF：悬空（非外部 REF_2V5）</text><text x="530" y="604">20 WDI → GND；19 WDO：悬空</text><text x="530" y="650" class="s">CT悬空：释放延时 14–24ms，典型20ms</text><text x="530" y="685" class="s">输入故障时置低；掉电与启动次序待实测</text><rect class="b" x="1120" y="115" width="450" height="270"/><text x="1140" y="150">UCC27511A</text><text x="1140" y="185">1 VDD ← 12V_HW</text><text x="1140" y="220">6 IN+ ← HW_READY</text><text x="1140" y="255">5 IN− ← DUMP_OFF_HW</text><text x="1140" y="290">4 GND → GND_SYS</text><text x="1140" y="330" class="s">HW_READY：10k至3V3_F</text><text x="1140" y="355" class="s">100k至GND；考虑200k约2.87V</text><rect class="b" x="30" y="340" width="450" height="435"/><text x="50" y="375">低窗口分压用0.1%；其余候选1%</text><text x="50" y="415" class="s">3V3_F — 61.9k — 3V3_DIV — 10k — GND</text><text x="50" y="450" class="s">12V_HW — 270k — 12V_DIV — 10k — GND</text><text x="50" y="485" class="s">REF_2V5 — 49.9k — REF_L_DIV — 10k — GND</text><text x="50" y="520" class="s">REF_2V5 — 56.2k — REF_H_DIV — 10k — GND</text><text x="50" y="565" class="s">名义跌落触发：3V3 2.876V；12V 11.2V</text><text x="50" y="600" class="s">REF 低 2.396V；高 2.648V；不含容差</text><text x="50" y="645" class="r s">REF低门限不能保证2.47V前关断！</text><text x="50" y="680" class="s">实际安全边界和角落计算必须补全</text><text x="30" y="830" class="r s">关键阻塞：10k上拉要求约70–90µA；0.9V启动复位仅保证15µA，不能证明默认低。</text><text x="30" y="865" class="s">100Ω × 有效电容≥1µF：理想3.3V阶跃斜率≥30µs/V；实际启动、残压及输入注入须验证。</text><text x="30" y="900" class="s">旧请求保持 GUARD 光耦 AND；独立过压支路仍接 IN−。旧12V和独立12V不直接相连。</text><text x="30" y="935" class="s">掉电SENSE可高于VDD但低于绝对上限；已超推荐范围，需验证反灌及复位。READY不接电容。</text></svg>
