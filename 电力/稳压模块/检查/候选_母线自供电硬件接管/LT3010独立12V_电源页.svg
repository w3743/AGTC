<g font-family="Microsoft YaHei, Arial" fill="#152332" font-size="18"><text x="70" y="150">BMS 下游 BUS</text><text x="448" y="155">8 IN</text><text x="448" y="205">5 SHDN → IN</text><text x="448" y="255">LT3010EMS8E#PBF</text><text x="448" y="295">4 GND / 9 EP</text><text x="613" y="155">OUT 1</text><text x="610" y="242">ADJ 2</text><text x="455" y="325">3 / 6 / 7 NC</text><text x="100" y="355">C_IN ≥1 µF 有效</text><text x="920" y="355">C_OUT ≥4.7 µF 有效</text><text x="845" y="260">84.5 kΩ</text><text x="845" y="282">0.1%</text><text x="845" y="415">10.0 kΩ</text><text x="845" y="437">0.1%</text><text x="925" y="260">C_FF 4.7 nF</text><text x="925" y="282">有效值 &gt;1.592 nF</text><text x="1080" y="155">J_TEST.1</text><text x="1080" y="575">J_TEST.2</text><text x="65" y="580">GND_SYS</text><text x="35" y="630">标称 VOUT = 12.049 V；测试接口悬置，实际互锁、电源预算、布局与热未闭合。</text><text x="35" y="660">C_FF 必需：10 kHz 时容抗小于 10 kΩ；各电容有效值、额定及降额需核实。</text><text x="35" y="690">BUS 接 IN 且 SHDN；EP 必须焊接接地。输入反接/瞬态及输出反向电流仍须全角审查。</text></g></svg>
