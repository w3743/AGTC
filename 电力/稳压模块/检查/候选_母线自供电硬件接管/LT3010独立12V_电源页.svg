<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="740" viewBox="0 0 1300 740">
<rect width="1300" height="740" fill="white"/><g font-family="Microsoft YaHei, Arial" fill="#152332"><text x="35" y="40" font-size="25" font-weight="bold">独立 12 V 测试电源（LT3010 可调版）</text><text x="35" y="68" font-size="17" fill="#b00020">HOLD · 仅电源页，未接互锁，不批准通电</text></g>
