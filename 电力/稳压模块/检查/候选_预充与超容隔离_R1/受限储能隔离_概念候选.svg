<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1020" viewBox="0 0 1600 1020">
<rect width="1600" height="1020" fill="white"/><g font-family="Arial, Microsoft YaHei" fill="#111">
<text x="45" y="45" font-size="27" font-weight="bold" fill="#ad001b">HOLD — 独立储能与早轨供电：原理概念候选，禁止上电或发布</text>
<text x="45" y="80" font-size="18">仅审查拓扑；门限、器件失效与端到端关断时间未闭合。图中既有电路只表示连接关系。</text>
<g stroke="#111" stroke-width="3" fill="none"><path d="M100 235 H250 M250 235 H400 M455 235 H850 M250 235 V390 H400 M490 390 H680 M680 390 H740 M795 390 H850 V235 H960 M680 390 V500 M850 235 H960 M960 235 H1060 M1240 235 H1330 M680 500 V520 M680 555 V590 M100 235 V150 H720"/><path d="M400 205 L400 265 L455 235 Z M460 205 V265 M740 360 L740 420 L795 390 Z M800 360 V420"/><rect x="400" y="370" width="90" height="40"/><path d="M660 520 H700 M660 535 H700 M680 535 V555 M665 590 H695 M670 600 H690 M675 610 H685"/><rect x="1060" y="200" width="180" height="70"/><path d="M600 390 V675 H900 M1110 675 H1240 M1240 675 H1370"/><rect x="900" y="635" width="210" height="80"/></g>
<g fill="#111"><circle cx="100" cy="235" r="5"/><circle cx="250" cy="235" r="5"/><circle cx="600" cy="390" r="5"/><circle cx="680" cy="390" r="5"/><circle cx="850" cy="235" r="5"/></g><g font-size="18"><text x="48" y="220">12V_PROT</text><text x="55" y="130">既有 12V_PROT 监控与硬过压供电：保留</text><text x="370" y="190">D_GUARD_HOLD（既有）</text><text x="375" y="290">A → K；1N5819HW-7-F</text><text x="402" y="355">R_CHG ≈430Ω</text><text x="405" y="435">1W 候选；须核精确料号及降额</text><text x="600" y="375">C_RESERVE</text><text x="630" y="645">原 C_GUARD_HOLD 移至此节点</text><text x="705" y="495">22µF 名义</text><text x="705" y="525">有效容量待证</text><text x="730" y="350">D_RESERVE 新增 A → K</text><text x="735" y="450">规格/漏电/压降待核</text><text x="845" y="215">LDO_IN</text><text x="1080" y="232">U_GUARD_BIAS</text><text x="1100" y="255">TLV76033</text><text x="1340" y="242">3V3_GUARD</text><text x="930" y="667">独立欠压读取</text><text x="930" y="695">开漏、门限待定</text><text x="1250" y="663">SC_RAIL_OK（既有开漏网）</text><text x="1250" y="714">现有上拉与多路复位</text><text x="1250" y="744">→ U_SC_CLR → 清锁存</text><text x="1250" y="766">→ 隔离及主桥撤销</text><text x="925" y="750">监控电源、Ioff、极性及断线默认待验证</text></g>
<g font-size="18"><text x="45" y="845">正常：直供二极管供 LDO；430Ω给储能充电，储能二极管反偏或近截止。具体压降和漏电须计算。</text><text x="45" y="875">储能短：限流约 31.1mA（13.2V / 425.7Ω），直供路径仍在；需证明早轨负载能力与硬过压不受影响。</text><text x="45" y="905">早轨掉到0V：储能经430Ω回灌，条件比较 2.2µF × (10.7−0.6−4.8)V / 136.1mA ≈85.7µs。</text><text x="45" y="935">105mA为LDO输入侧压力假设；实际3.3V负载及LDO热资格未闭合。LDO_IN短路为共同点。</text><text x="45" y="965">缺证：分压及欠压门限、有效电容、直供/储能二极管全温特性、失电电流、实际关断与恢复新 ARM。</text></g></g></svg>
