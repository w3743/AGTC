<g font-size="17"><text x="75" y="574">B0</text><text x="40" y="640">条件筛查：电阻各总误差 ±3%；VCE ≤0.2V 仅为假设，尚无实际 LED 电流及全温保证。</text><text x="40" y="670">3.0–3.6V 下 READY 约 0.485–0.549 × VCC；阈值约 0.320–0.347 和 0.653–0.680 × VCC。</text><text x="40" y="700">开路/熄灯高、信号短 B0 低；不覆盖短接至窗口电压、光耦内部短路或比较器故障。</text><text x="40" y="730">待闭合：CTR、VCE、漏电全温、线束漏电串阻、阈值漂移、欠压默认、噪声、恢复及新请求资格。</text><text x="40" y="760">两路推挽输出不可并接；供电监控、故障锁存及运行状态处置另行设计验证。</text></g></g></svg>
