<text x="40" y="43" fill="#b00020" font-size="27" font-weight="bold">HOLD — 独立反馈硬早泄放：结构概念，禁止投入使用</text>
<text x="40" y="76" font-size="18">电池及超容均拒充时的中央接管候选；旧 TLV6700 和 PB7 各自保留。标称值仅为筛查起点，不是已接受门槛。</text>
