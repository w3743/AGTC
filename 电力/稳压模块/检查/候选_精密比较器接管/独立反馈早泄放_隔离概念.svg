<g font-size="18">
<text x="45" y="220">BUS_EXT</text><text x="175" y="205">143.6kΩ 候选</text><text x="385" y="135">6.8MΩ 候选</text><text x="390" y="390">10kΩ 候选</text><text x="376" y="225">SENSE+</text>
<text x="462" y="243">+</text><text x="462" y="295">−</text><text x="470" y="265">TLV1811</text><text x="470" y="340">供电：12V_PROT</text><text x="650" y="248">CMP_OUT</text>
<text x="205" y="530">12V_PROT → REF5025</text><text x="225" y="575">2.5V 参考</text><text x="280" y="620">有效与启动顺序待证</text>
<text x="800" y="250">独立硬门 / 使能</text><text x="800" y="280">型号及供电待定</text><text x="790" y="320">GUARD_OK 及参考有效</text><text x="790" y="345">只门控新增支路</text>
<text x="1070" y="250">栅极与下拉待定</text><text x="1230" y="350">Q_EARLY：低侧 NMOS 候选</text><text x="1368" y="145">既有 PB7 支路</text><text x="1368" y="205">既有 TLV6700 后备</text><text x="1250" y="190">DUMP_OFF</text><text x="1260" y="290">同网 → 原 UCC → 0.82Ω</text>
<text x="1060" y="520">BUS 带电 / 保护轨失电</text><text x="1174" y="572">输入保护待证</text><text x="1040" y="635">本框是待解决条件，不代表已接入或已合格。</text>
</g>
<g font-size="18">
<text x="40" y="730">独立反馈仅来自 CMP_OUT，不从共用 DUMP_OFF 反馈；禁止让新支路门控或阻断原硬过压链。</text>
<text x="40" y="765">待闭合：全温动作/释放门槛、比较器小过驱传播及负载；参考和硬门上电、复位、掉电及瞬断默认态。</text>
<text x="40" y="800">待闭合：BUS 有电而 12V_PROT 为零时的输入绝对额定、注入/反灌和保护；分压单故障。</text>
<text x="40" y="835">待闭合：MOS、UCC、泄放电阻的真实电流建立时间、0.82Ω 脉冲/重复能量及整车 3m 停车验证。</text>
<text x="40" y="870">143.6kΩ 为 143kΩ＋604Ω 比较值；静态角落为条件筛查。栅阻/下拉与硬门接法未定。</text><text x="40" y="900">本图不是可采购 BOM、原生图、官方 DRC 或完整仿真。</text>
</g></g></svg>
