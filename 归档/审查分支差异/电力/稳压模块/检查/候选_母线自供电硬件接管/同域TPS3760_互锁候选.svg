<text x="35" y="750" class="red">验收：12V_SRC→22Ω→22Ω→12V_HW；源端≥1µF、同轨节点≥10µF有效。</text><text x="35" y="784" class="red">参考上电建立最大时间无保证：所有允许波形下 READY 前参考有效必须实测。</text><text x="35" y="818">正充斜率≤30.3mV/µs；硬短下降斜率和电阻重复脉冲须验证。</text><text x="35" y="852">CTR约2.03–3.89ms；恢复时未放尽可能缩短；保持波形与热须验证。</text><text x="35" y="885">硬READY：旧 Q_READY_LED E→新 BC847C C，E→GND；HW_READY→10k→B，B→100k→GND。</text><text x="35" y="910">恢复14V→READY≤50ms；已就绪越泄放阈→电流匹配≤0.5ms；均待台架。</text></svg>






