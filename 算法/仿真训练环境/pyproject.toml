[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "isaac-field"
version = "0.1.0"
description = "Isaac Lab tasks for a differential tracked agricultural robot"
requires-python = ">=3.12,<3.13"
dependencies = ["isaaclab-dev[sb3,rsl-rl,viser]", "sb3-contrib==2.9.0", "vqf==2.1.2"]

[project.entry-points."isaaclab.tasks"]
isaac_field = "isaac_field.tasks"

[tool.setuptools.packages.find]
include = ["isaac_field*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
