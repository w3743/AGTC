[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "isaac-field"
version = "0.1.0"
description = "Isaac Lab tasks for a differential tracked agricultural robot"
requires-python = ">=3.12,<3.13"
dependencies = ["isaaclab", "rsl-rl-lib==5.5.1", "viser>=1.0.16", "vqf==2.1.2"]

[project.optional-dependencies]
legacy-sb3 = ["stable-baselines3>=2.6", "sb3-contrib==2.9.0"]

[project.entry-points."isaaclab.tasks"]
isaac_field = "isaac_field.tasks"

[tool.setuptools.packages.find]
include = ["isaac_field*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
