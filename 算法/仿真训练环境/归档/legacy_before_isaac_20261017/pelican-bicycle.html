<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5efe1">
  <title>海风正好，出发吧 · 鹈鹕的海岸骑行</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f5efe1;
      --ink: #193d43;
      --muted: #668084;
      --sea: #78c9c0;
      --coral: #ef8066;
      --sun: #f3c86b;
      --line: rgba(25, 61, 67, .14);
      font-family: "Aptos", "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: clamp(18px, 4vw, 54px) 20px 28px;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 12% 5%, rgba(255,255,255,.72), transparent 32%),
        radial-gradient(ellipse at 92% 28%, rgba(229,199,139,.2), transparent 27%),
        var(--paper);
    }
    .page { width: min(1120px, 100%); margin: 0 auto; }
    .topline {
      display: flex; align-items: center; justify-content: space-between;
      gap: 18px; margin: 0 4px 22px;
    }
    .brand {
      display: inline-flex; align-items: center; gap: 10px;
      color: #557276; font-size: 12px; letter-spacing: .16em; font-weight: 800;
      text-transform: uppercase;
    }
    .brand-mark {
      display: grid; place-items: center; width: 30px; height: 30px;
      border: 1px solid rgba(25,61,67,.17); border-radius: 50%;
      color: var(--coral); font-size: 16px; letter-spacing: 0;
      background: rgba(255,255,255,.48);
    }
    .edition { color: #869997; font-size: 11px; letter-spacing: .18em; font-weight: 700; }
    .card {
      overflow: hidden; border: 1px solid rgba(47,85,83,.15); border-radius: 30px;
      background: rgba(255,253,246,.78);
      box-shadow: 0 24px 70px rgba(73,83,61,.12), 0 3px 9px rgba(73,83,61,.045);
    }
    .intro {
      display: flex; align-items: end; justify-content: space-between;
      gap: 24px; padding: clamp(24px, 4.5vw, 49px) clamp(24px, 5vw, 58px) 25px;
    }
    .kicker {
      display: flex; align-items: center; gap: 9px; margin-bottom: 13px;
      color: #67827f; font-size: 11px; font-weight: 800; letter-spacing: .17em;
    }
    .kicker::before { content: ""; width: 24px; height: 2px; border-radius: 3px; background: var(--coral); }
    h1 { margin: 0; font-family: "Songti SC", "Noto Serif CJK SC", "Source Han Serif SC", Georgia, serif; font-size: clamp(31px, 5vw, 54px); line-height: 1.12; letter-spacing: .035em; font-weight: 700; }
    .subtitle { margin: 12px 0 0; color: var(--muted); font-size: 14px; letter-spacing: .04em; }
    .trip-stamp {
      flex: 0 0 auto; display: flex; align-items: center; gap: 11px;
      padding: 10px 14px 10px 10px; border: 1px solid var(--line); border-radius: 999px;
      color: #58797a; background: rgba(255,255,255,.52); font-size: 11px; font-weight: 700;
    }
    .sun-dot { width: 25px; height: 25px; border-radius: 50%; background: var(--sun); box-shadow: inset -4px -3px 0 rgba(208,151,61,.16); }
    .scene-wrap { position: relative; margin: 0 clamp(10px, 2vw, 22px); overflow: hidden; border-radius: 23px; background: #dff1e7; }
    .scene-wrap::after { position: absolute; inset: 0; content: ""; pointer-events: none; border: 1px solid rgba(255,255,255,.36); border-radius: inherit; }
    svg.scene { display: block; width: 100%; height: auto; }
    .scene text { font-family: "Aptos", "Microsoft YaHei", system-ui, sans-serif; }
    .ground-shadow { fill: #386a67; opacity: .14; }
    .wheel-tire { fill: none; stroke: #214d51; stroke-width: 11; }
    .wheel-side { fill: none; stroke: #f8f2df; stroke-width: 2.4; opacity: .9; }
    .spokes line { stroke: #e8e4d1; stroke-width: 2; opacity: .85; }
    .hub { fill: #ef8066; stroke: #fff5df; stroke-width: 3; }
    .frame { fill: none; stroke: #ed8068; stroke-width: 10; stroke-linecap: round; stroke-linejoin: round; }
    .frame-shadow { fill: none; stroke: #b95d50; stroke-width: 2.2; stroke-linecap: round; opacity: .48; }
    .bike-detail { fill: none; stroke: #214d51; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }
    .pelican-outline { stroke: #d9e5d8; stroke-width: 2; stroke-linejoin: round; }
    .feather-line { fill: none; stroke: #d0dfd2; stroke-width: 3; stroke-linecap: round; }
    .leg { fill: none; stroke: #e98253; stroke-width: 9; stroke-linecap: round; stroke-linejoin: round; }
    .leg-back { fill: none; stroke: #d76f4f; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }
    .scarf-tail { transform-box: view-box; transform-origin: 648px 268px; animation: scarf-dance 1.35s ease-in-out infinite; }
    @keyframes scarf-dance { 0%,100% { transform: rotate(-2deg) translateY(0); } 50% { transform: rotate(3deg) translateY(-3px); } }
    .control-row {
      display: flex; align-items: center; justify-content: space-between; gap: 20px;
      padding: 21px clamp(22px, 4vw, 44px) 25px;
    }
    .caption { display: flex; align-items: center; gap: 12px; color: #587276; font-size: 12px; line-height: 1.6; }
    .caption-icon { display: grid; place-items: center; flex: 0 0 auto; width: 34px; height: 34px; border-radius: 50%; color: #397b79; background: #e3f1e8; font-size: 15px; }
    .caption strong { color: #254d52; font-weight: 700; }
    .controls { display: flex; align-items: center; gap: 18px; }
    .pause {
      display: inline-flex; align-items: center; gap: 9px; min-height: 42px; padding: 0 16px;
      border: 1px solid rgba(25,61,67,.18); border-radius: 999px; color: #21484d;
      background: #fffdf6; font: inherit; font-size: 12px; font-weight: 750; cursor: pointer;
      transition: background .2s, transform .2s, border-color .2s;
    }
    .pause:hover { transform: translateY(-1px); border-color: rgba(25,61,67,.36); background: #fff; }
    .pause:focus-visible, input:focus-visible { outline: 3px solid rgba(239,128,102,.52); outline-offset: 3px; }
    .pause-icon { display: inline-flex; align-items: center; justify-content: center; width: 15px; height: 15px; color: var(--coral); font-size: 15px; line-height: 1; }
    .speed-control { display: flex; align-items: center; gap: 10px; color: #71888a; font-size: 11px; font-weight: 700; white-space: nowrap; }
    input[type="range"] { width: 102px; accent-color: #398781; cursor: pointer; }
    output { min-width: 31px; color: #315f61; font-variant-numeric: tabular-nums; }
    .footnote { margin: 15px 5px 0; text-align: center; color: #91a09a; font-size: 10px; letter-spacing: .16em; }
    @media (max-width: 680px) {
      body { padding-inline: 12px; }
      .topline { margin-bottom: 15px; }
      .edition { font-size: 9px; }
      .card { border-radius: 23px; }
      .intro { align-items: start; flex-direction: column; gap: 17px; padding-bottom: 20px; }
      .trip-stamp { align-self: flex-start; }
      .scene-wrap { margin-inline: 8px; border-radius: 17px; }
      .control-row { align-items: flex-start; flex-direction: column; gap: 18px; padding-top: 19px; }
      .controls { width: 100%; justify-content: space-between; }
    }
    @media (max-width: 390px) {
      .controls { gap: 8px; }
      .pause { padding-inline: 12px; }
      input[type="range"] { width: 78px; }
      .speed-control { gap: 6px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .scarf-tail { animation-duration: 3s; }
      .pause { transition: none; }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="topline">
      <div class="brand"><span class="brand-mark" aria-hidden="true">✳</span> Little Coast Club</div>
      <div class="edition">A SMALL JOURNEY · 01</div>
    </div>

    <article class="card" aria-labelledby="page-title">
      <header class="intro">
        <div>
          <div class="kicker">今日份海岸旅行</div>
          <h1 id="page-title">海风正好，出发吧</h1>
          <p class="subtitle">一只鹈鹕的海岸骑行日记</p>
        </div>
        <div class="trip-stamp"><span class="sun-dot" aria-hidden="true"></span><span>晴天 · 微风<br>沿着海岸慢慢骑</span></div>
      </header>

      <div class="scene-wrap">
        <svg class="scene" viewBox="0 0 1200 680" role="img" aria-labelledby="scene-title scene-desc">
          <title id="scene-title">鹈鹕骑自行车沿海岸旅行</title>
          <desc id="scene-desc">白色鹈鹕围着珊瑚色围巾，骑着蓝绿色自行车穿过阳光明亮的海岸。车轮转动，双腿踩动踏板，海岸向后流动。</desc>
          <defs>
            <linearGradient id="sky" x1="0" x2="0" y1="0" y2="1">
              <stop offset="0" stop-color="#eff2dc"/><stop offset="1" stop-color="#d8eee1"/>
            </linearGradient>
            <linearGradient id="water" x1="0" x2="0" y1="0" y2="1">
              <stop offset="0" stop-color="#79c9bf"/><stop offset="1" stop-color="#3c9996"/>
            </linearGradient>
            <linearGradient id="sand" x1="0" x2="1" y1="0" y2="1">
              <stop offset="0" stop-color="#e8cf9c"/><stop offset="1" stop-color="#cfb47d"/>
            </linearGradient>
            <linearGradient id="feather" x1="0" x2="1" y1="0" y2="1">
              <stop offset="0" stop-color="#fffef4"/><stop offset="1" stop-color="#e9f0e4"/>
            </linearGradient>
            <pattern id="water-grain" width="90" height="30" patternUnits="userSpaceOnUse">
              <path d="M4 14q14-7 29 0t29 0" fill="none" stroke="#d5f0df" stroke-width="2" opacity=".38"/>
              <circle cx="71" cy="8" r="2" fill="#fff5dc" opacity=".55"/>
            </pattern>
            <clipPath id="scene-clip"><rect width="1200" height="680" rx="20"/></clipPath>
          </defs>
          <g clip-path="url(#scene-clip)">
            <rect width="1200" height="680" fill="url(#sky)"/>
            <!-- sun and slow, distant clouds -->
            <circle cx="936" cy="123" r="61" fill="#f3c86b" opacity=".95"/>
            <circle cx="936" cy="123" r="78" fill="none" stroke="#f3c86b" stroke-width="1.5" opacity=".28"/>
            <g fill="#fffdf0" opacity=".66">
              <path d="M158 153c3-16 17-27 34-27 8-20 37-25 52-8 5 6 8 12 8 20 14-2 26 7 28 20H158Z"/>
              <path d="M760 194c2-12 12-20 25-20 6-15 27-19 39-6 4 4 6 9 6 15 10-1 19 5 20 15H760Z" opacity=".55"/>
            </g>
            <!-- headland -->
            <path d="M0 274c97-64 184-68 272-24 56 28 99 26 166-6 69-34 127-24 194 6 62 28 117 27 180-2 91-43 164-24 238 15 49 26 90 32 150 5v119H0Z" fill="#abc9a0"/>
            <path d="M0 331c105-31 185-30 265-7 70 20 139 30 217 1 100-37 193-15 272 12 64 22 143 13 217-10 85-27 157-20 229 5v118H0Z" fill="#82b9a1"/>
            <path d="M0 359c100-14 195-11 281 10 88 22 168 20 261-5 88-24 169-13 249 11 83 26 158 17 232-4 61-17 118-19 177-10v117H0Z" fill="url(#water)"/>
            <rect y="359" width="1200" height="121" fill="url(#water-grain)"/>
            <g id="wave-sparkles" fill="none" stroke="#e7f5dc" stroke-linecap="round" opacity=".72">
              <path d="M82 396h54m27 17h34m815-29h49m39 25h31m-776 13h49" stroke-width="3"/>
              <path d="M236 432h26m598-30h40m-191 44h28m304-12h47" stroke-width="2" opacity=".7"/>
            </g>
            <!-- curling white surf -->
            <path d="M0 456c96-17 168 16 242 4 76-12 125-32 204-15 74 16 117 30 192 12 89-21 140-21 223-2 101 23 176 19 260-1 34-8 61-10 79-8v70H0Z" fill="#f6f0dc"/>
            <path d="M0 476c96-17 169 16 244 4 74-12 122-32 201-15 76 16 119 30 194 12 89-21 140-21 223-2 101 23 175 19 260-1 31-8 57-10 78-8" fill="none" stroke="#fffdf2" stroke-width="8" opacity=".75"/>
            <!-- sandy cycling path -->
            <path d="M0 500c155-25 285-21 412 0 115 18 227 24 345 5 133-21 273-27 443-4v179H0Z" fill="url(#sand)"/>
            <path d="M0 521c182-22 311-9 445 7 150 18 256 17 391-3 145-21 251-18 364-2" fill="none" stroke="#f5e4bd" stroke-width="5" opacity=".8"/>
            <ellipse class="ground-shadow" cx="610" cy="614" rx="340" ry="25"/>
            <!-- tiny coast plants -->
            <g fill="none" stroke="#6b9e7d" stroke-linecap="round" stroke-width="5" opacity=".74">
              <path d="M94 520q-7-25-24-36m25 36q2-29 18-42m-20 40q-14-16-31-16"/>
              <path d="M1090 513q6-25 22-38m-22 40q-4-26-19-40m17 43q17-14 32-13"/>
              <path d="M1022 537q-5-16-16-23m17 24q2-20 11-29"/>
            </g>
            <!-- moving road details -->
            <g id="road-marks" fill="#f5e6bf" opacity=".63">
              <path d="M-110 640h72l-11 5h-72Z"/><path d="M80 620h61l-10 5H70Z"/>
              <path d="M277 644h74l-11 5h-73Z"/><path d="M469 622h65l-10 5h-65Z"/>
              <path d="M668 646h77l-11 5h-77Z"/><path d="M869 621h64l-9 5h-65Z"/>
              <path d="M1063 644h76l-11 5h-75Z"/><path d="M1255 620h70l-10 5h-69Z"/>
            </g>

            <!-- bicycle wheels -->
            <g class="wheel-spin" data-x="426" data-y="524">
              <circle class="wheel-tire" r="109"/><circle class="wheel-side" r="99"/>
              <g class="spokes">
                <line x1="0" y1="-97" x2="0" y2="97"/><line x1="-97" y1="0" x2="97" y2="0"/>
                <line x1="-69" y1="-69" x2="69" y2="69"/><line x1="69" y1="-69" x2="-69" y2="69"/>
                <line x1="-37" y1="-90" x2="37" y2="90"/><line x1="37" y1="-90" x2="-37" y2="90"/>
                <line x1="-90" y1="-37" x2="90" y2="37"/><line x1="90" y1="-37" x2="-90" y2="37"/>
              </g><circle class="hub" r="8"/>
            </g>
            <g class="wheel-spin" data-x="792" data-y="524">
              <circle class="wheel-tire" r="109"/><circle class="wheel-side" r="99"/>
              <g class="spokes">
                <line x1="0" y1="-97" x2="0" y2="97"/><line x1="-97" y1="0" x2="97" y2="0"/>
                <line x1="-69" y1="-69" x2="69" y2="69"/><line x1="69" y1="-69" x2="-69" y2="69"/>
                <line x1="-37" y1="-90" x2="37" y2="90"/><line x1="37" y1="-90" x2="-37" y2="90"/>
                <line x1="-90" y1="-37" x2="90" y2="37"/><line x1="90" y1="-37" x2="-90" y2="37"/>
              </g><circle class="hub" r="8"/>
            </g>
            <!-- bicycle frame and controls -->
            <g>
              <path class="frame" d="M426 524 566 416 614 524 426 524M566 416h145l-97 108M614 524 711 416"/>
              <path class="frame-shadow" d="M426 524 566 416 614 524 426 524M566 416h145l-97 108M614 524 711 416"/>
              <path class="bike-detail" d="m566 416-24-17m9 0 34 1m126 16 10-31m-17 0h47m-1 0 15 8m-14-8-11 8"/>
              <path d="M706 416 714 381" fill="none" stroke="#214d51" stroke-width="10" stroke-linecap="round"/>
              <path d="M693 381h54" fill="none" stroke="#214d51" stroke-width="9" stroke-linecap="round"/>
              <circle cx="614" cy="524" r="31" fill="none" stroke="#214d51" stroke-width="5"/>
              <path d="M614 524 641 543m-54-6 27-13" fill="none" stroke="#214d51" stroke-width="6" stroke-linecap="round"/>
              <path d="M632 545h24m-69-10h23" fill="none" stroke="#ef8066" stroke-width="6" stroke-linecap="round"/>
              <path d="M538 400h38" fill="none" stroke="#214d51" stroke-width="12" stroke-linecap="round"/>
              <path d="M707 405v22" fill="none" stroke="#f2c96c" stroke-width="4" stroke-linecap="round"/>
            </g>

            <!-- rider's pedaling legs are positioned by the animation -->
            <g id="legs-back">
              <path id="leg-back-path" class="leg-back" d=""/>
              <circle id="knee-back" r="7" fill="#f5b16b"/>
              <path id="foot-back" d="" fill="#e98253" stroke="#fff2d6" stroke-width="2" stroke-linejoin="round"/>
            </g>
            <g id="legs-front">
              <path id="leg-front-path" class="leg" d=""/>
              <circle id="knee-front" r="8" fill="#f8be77" stroke="#fff2d6" stroke-width="2"/>
              <path id="foot-front" d="" fill="#f08a54" stroke="#fff2d6" stroke-width="2" stroke-linejoin="round"/>
            </g>

            <!-- pelican: round body, long neck, expressive bill and wing -->
            <g id="pelican-upper">
              <g>
                <path d="M547 354c-8-37 14-79 58-91 39-11 85 8 100 42 14 33-3 76-35 93-34 18-105 8-123-44Z" fill="url(#feather)" class="pelican-outline"/>
                <path d="M566 341c15-28 41-40 69-41 24-1 44 8 57 23-5 29-29 51-60 57-29 5-53-8-66-39Z" fill="#f8f7eb"/>
                <path class="feather-line" d="M574 349q27-17 57-13m-45 30q27-15 51-12m-40 28q22-10 41-7"/>
                <!-- neck sweeping upward -->
                <path d="M613 350c12-29 19-62 29-89 9-24 22-41 44-39 15 1 24 13 20 26-3 10-13 15-25 13-13 18-18 39-20 61-2 23-10 38-25 49Z" fill="url(#feather)" class="pelican-outline"/>
                <path d="M651 297c9-31 15-53 29-65" fill="none" stroke="#d7e4d6" stroke-width="3" stroke-linecap="round"/>
                <!-- wing reaches the handlebar -->
                <path d="M589 309c33-17 69-5 97 13 22 14 43 34 64 60 8 10 8 19 0 24-8 5-16 0-23-7-25-25-44-41-67-48-27-8-47 1-70 15-17-12-20-38-1-57Z" fill="#fffdf2" class="pelican-outline"/>
                <path class="feather-line" d="M607 319q36-9 71 21m-63-6q37-6 68 24m-58-7q31 0 57 25m-44-8q22 4 40 22"/>
                <path d="M737 378q7 7 14 14 6 6 2 12-6 6-12 0l-15-16" fill="#fffdf2" stroke="#d9e5d8" stroke-width="2" stroke-linejoin="round"/>
              </g>
              <!-- coral scarf, tails flutter in the breeze -->
              <g class="scarf-tail">
                <path d="M640 275q10 8 28 4l13-5q7-2 10 4l-16 9 17 9q-3 8-11 5l-19-6q-17 7-29-4Z" fill="#ef8066"/>
                <path d="M645 278q9 7 22 4" fill="none" stroke="#ffd19e" stroke-width="2" stroke-linecap="round" opacity=".8"/>
              </g>
              <!-- head -->
              <path d="M650 234c-3-20 12-39 35-42 21-3 39 12 40 32 1 19-14 34-35 35-19 1-36-8-40-25Z" fill="url(#feather)" class="pelican-outline"/>
              <path d="M665 205q17-20 39-8" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" opacity=".8"/>
              <!-- iconic long bill and soft throat pouch -->
              <path d="M710 229c37 0 86 7 137 23-40 12-88 15-127 5-13-4-21-13-10-28Z" fill="#f6bd59" stroke="#d78b43" stroke-width="2" stroke-linejoin="round"/>
              <path d="M712 242c20 20 57 36 108 10-10 27-32 45-60 39-25-5-43-24-48-49Z" fill="#ee8064" stroke="#d86c58" stroke-width="2" stroke-linejoin="round"/>
              <path d="M727 253q34 18 72 7" fill="none" stroke="#f8ae8b" stroke-width="3" stroke-linecap="round"/>
              <path d="M710 229 694 218" fill="none" stroke="#d78b43" stroke-width="2" stroke-linecap="round"/>
              <!-- bright, friendly eye -->
              <circle cx="685" cy="219" r="10" fill="#fffdf4"/>
              <circle cx="688" cy="220" r="5.5" fill="#193d43"/>
              <circle cx="690" cy="218" r="1.8" fill="#fff"/>
              <path d="M675 207q10-7 20-3" fill="none" stroke="#d9e5d8" stroke-width="3" stroke-linecap="round"/>
              <!-- little cheek -->
              <ellipse cx="700" cy="239" rx="6" ry="3.5" fill="#f0a08a" opacity=".52"/>
            </g>
            <!-- scene annotations -->
            <g transform="translate(62 72)" opacity=".88">
              <path d="M0 12h35" stroke="#ef8066" stroke-width="2.5" stroke-linecap="round"/>
              <text x="0" y="0" fill="#527678" font-size="11" font-weight="700" letter-spacing="2.4">SALT AIR, SLOW RIDE</text>
            </g>
            <g transform="translate(1048 315)" fill="none" stroke="#fff4dc" stroke-linecap="round" opacity=".72">
              <path d="M0 0q18-12 35 0m-25 12q12-8 24 0m-30 12q8-5 17 0" stroke-width="2.5"/>
            </g>
          </g>
        </svg>
      </div>

      <div class="control-row">
        <div class="caption"><span class="caption-icon" aria-hidden="true">↗</span><span><strong>沿着海岸线，慢慢骑。</strong><br>海浪、车轮和围巾，都在轻轻摇摆。</span></div>
        <div class="controls">
          <label class="speed-control" for="speed">骑行速度 <input id="speed" type="range" min="0.5" max="1.8" step="0.1" value="1"><output id="speed-value" for="speed">1.0×</output></label>
          <button class="pause" id="pause" type="button" aria-pressed="false"><span class="pause-icon" id="pause-icon" aria-hidden="true">Ⅱ</span><span id="pause-label">暂停旅程</span></button>
        </div>
      </div>
    </article>
    <p class="footnote">TAKE THE LONG WAY HOME &nbsp;·&nbsp; 海风会记得今天</p>
  </main>

  <script>
    (() => {
      const svg = document.querySelector('.scene');
      const wheels = [...svg.querySelectorAll('.wheel-spin')];
      const road = svg.querySelector('#road-marks');
      const wave = svg.querySelector('#wave-sparkles');
      const pelican = svg.querySelector('#pelican-upper');
      const speedInput = document.querySelector('#speed');
      const speedValue = document.querySelector('#speed-value');
      const pauseButton = document.querySelector('#pause');
      const pauseLabel = document.querySelector('#pause-label');
      const pauseIcon = document.querySelector('#pause-icon');
      const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
      let speed = Number(speedInput.value);
      let paused = false;
      let previous = 0;
      let elapsed = 0;

      function setLeg(prefix, hip, foot, upperLength, lowerLength, bend) {
        const dx = foot.x - hip.x;
        const dy = foot.y - hip.y;
        const distance = Math.hypot(dx, dy) || 1;
        const reach = Math.min(upperLength + lowerLength - .01, Math.max(Math.abs(upperLength - lowerLength) + .01, distance));
        const along = (upperLength * upperLength - lowerLength * lowerLength + reach * reach) / (2 * reach);
        const across = Math.sqrt(Math.max(0, upperLength * upperLength - along * along));
        const ux = dx / distance;
        const uy = dy / distance;
        const knee = {
          x: hip.x + ux * along - uy * across * bend,
          y: hip.y + uy * along + ux * across * bend
        };
        const path = svg.querySelector(`#leg-${prefix}-path`);
        const kneeDot = svg.querySelector(`#knee-${prefix}`);
        const footShape = svg.querySelector(`#foot-${prefix}`);
        path.setAttribute('d', `M${hip.x.toFixed(1)} ${hip.y.toFixed(1)} L${knee.x.toFixed(1)} ${knee.y.toFixed(1)} L${foot.x.toFixed(1)} ${foot.y.toFixed(1)}`);
        kneeDot.setAttribute('cx', knee.x.toFixed(1));
        kneeDot.setAttribute('cy', knee.y.toFixed(1));
        const toe = prefix === 'front' ? 1 : -1;
        footShape.setAttribute('d', `M${(foot.x - 7).toFixed(1)} ${foot.y.toFixed(1)} q${(10 * toe).toFixed(1)} -11 ${(23 * toe).toFixed(1)} -8 q7 2 5 8 l${(-5 * toe).toFixed(1)} 6 q-8 5 -${(20 * toe).toFixed(1)} 1Z`);
      }

      function frame(now) {
        if (!previous) previous = now;
        const delta = Math.min((now - previous) / 1000, .05);
        previous = now;
        if (!paused) elapsed += delta * speed * (prefersReducedMotion.matches ? .45 : 1);
        const pedalAngle = elapsed * 3.45;
        const wheelAngle = -elapsed * 3.45 * (614 - 426) / 109 * 180 / Math.PI;
        wheels.forEach((wheel) => {
          const x = wheel.dataset.x;
          const y = wheel.dataset.y;
          wheel.setAttribute('transform', `translate(${x} ${y}) rotate(${wheelAngle % 360})`);
        });
        const bob = Math.sin(pedalAngle * 2) * 2.2;
        pelican.setAttribute('transform', `translate(0 ${bob.toFixed(2)})`);
        const crank = { x: 614, y: 524 };
        const radius = 32;
        const footA = { x: crank.x + Math.cos(pedalAngle) * radius, y: crank.y + Math.sin(pedalAngle) * radius };
        const footB = { x: crank.x + Math.cos(pedalAngle + Math.PI) * radius, y: crank.y + Math.sin(pedalAngle + Math.PI) * radius };
        setLeg('back', { x: 583, y: 400 + bob }, footB, 68, 72, -1);
        setLeg('front', { x: 607, y: 399 + bob }, footA, 70, 73, 1);
        road.setAttribute('transform', `translate(${(elapsed * 92) % 192} 0)`);
        wave.setAttribute('transform', `translate(${(elapsed * -8) % 45} 0)`);
        requestAnimationFrame(frame);
      }

      speedInput.addEventListener('input', () => {
        speed = Number(speedInput.value);
        speedValue.value = `${speed.toFixed(1)}×`;
        speedValue.textContent = `${speed.toFixed(1)}×`;
      });
      pauseButton.addEventListener('click', () => {
        paused = !paused;
        pauseButton.setAttribute('aria-pressed', String(paused));
        pauseLabel.textContent = paused ? '继续旅程' : '暂停旅程';
        pauseIcon.textContent = paused ? '▶' : 'Ⅱ';
      });
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
